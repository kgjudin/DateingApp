name: vybe_app
description: "VYBE – Voice-First Social Discovery & Communication Platform"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management & Routing
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1

  # Network & Realtime
  http: ^1.3.0
  socket_io_client: ^3.0.2

  # Voice & RTC
  agora_rtc_engine: ^6.5.2
  permission_handler: ^11.4.0

  # UI, Fonts & Animations
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  cached_network_image: ^3.4.1

  # Local Storage & Utils
  shared_preferences: ^2.5.2
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

dependency_overrides:
  path_provider_foundation: 2.4.0

flutter:
  uses-material-design: true
